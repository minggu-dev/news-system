spring.application.name=news-system

# ==========================================================
# 데이터베이스 설정 (SQLite)
# ==========================================================
# SQLite 드라이버 및 파일 기반 DB 경로 설정 (프로젝트 루트에 news_system.db 파일 생성)
spring.datasource.url=jdbc:sqlite:news_system.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ==========================================================
# JPA / Hibernate 설정
# ==========================================================
# Hibernate가 SQLite 문법을 올바르게 해석할 수 있도록 Dialect(방언) 지정
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# 애플리케이션 시작 시 엔티티 구조에 맞춰 테이블을 자동으로 생성/수정 (개발 단계 편의용)
spring.jpa.hibernate.ddl-auto=update

# 디버깅 및 검증을 위해 실행되는 SQL 쿼리를 콘솔 창에 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# 웹 서버 및 기타 설정
# ==========================================================
# 프론트엔드(React) 환경과의 원활한 로컬 API 통신 테스트를 위해 포트 변경 가능 (기본값: 8080)
server.port=8080

# ==========================================================
# 인코딩 설정 (UTF-8 강제)
# ==========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ==========================================================
# 로그 파일 저장 및 백업 보존 설정 (일단위 압축 롤링)
# ==========================================================
# 1. 로그 파일이 생성될 디렉토리 경로 지정 (프로젝트 루트의 /logs)
logging.file.path=./logs
# 2. 로그 파일 최대 보존 일수 (30일 보관 후 자동 삭제)
logging.logback.rollingpolicy.max-history-days=30
# 3. 단일 로그 파일 최대 크기 (10MB 초과 시 .gz로 압축 백업하고 새 파일 작성)
logging.logback.rollingpolicy.max-file-size=10MB